                .WithMany()
                .HasForeignKey("hero_id")
                .OnDelete(DeleteBehavior.Cascade);
            entity.HasOne(Skill)
                .WithMany()
                .HasForeignKey("skill_key")
                .OnDelete(DeleteBehavior.Restrict);
            entity.ToTable("hero_skills", table =>
