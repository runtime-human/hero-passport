      - name: Restore tools and build
        run: |
          dotnet tool restore
          dotnet restore HeroPassport.slnx
          dotnet build HeroPassport.slnx --no-restore -c Release
      - name: Generate EF migration
        run: |
          dotnet ef migrations add AddRewardSkillPersistence \
            --project src/HeroPassport.Infrastructure/HeroPassport.Infrastructure.csproj \
            --output-dir Persistence/GeneratedMigrations \
            --configuration Release \
            --no-build
      - name: Verify Application contract
        run: dotnet test tests/HeroPassport.Application.Tests/HeroPassport.Application.Tests.csproj --no-build -c Release --logger "console;verbosity=normal"
      - name: Commit materialized implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/HeroPassport.Infrastructure/Persistence/HeroPassportStorageModel.cs \
            src/HeroPassport.Infrastructure/Persistence/RewardSkillStorageModel.cs \
            src/HeroPassport.Infrastructure/Persistence/SqliteHeroPassportStateStore.FinishQuest.cs \
            src/HeroPassport.Infrastructure/Persistence/SqliteHeroPassportStateStore.RewardSkills.cs \
            src/HeroPassport.Infrastructure/Persistence/GeneratedMigrations
          git diff --cached --check
          git commit -m "feat(rpg): persist reward and skill progression"
          git push origin HEAD:feat/reward-skill-persistence
