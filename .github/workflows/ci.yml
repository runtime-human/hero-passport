name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.302
      - name: SDK
        run: dotnet --info
      - name: Restore
        run: dotnet restore HeroPassport.slnx
      - name: Build
        run: dotnet build HeroPassport.slnx --no-restore -c Release
      - name: Restore local tools
        run: dotnet tool restore
      - name: Generate migration metadata
        run: dotnet ef migrations add InitialFoundation --project src/HeroPassport.Infrastructure/HeroPassport.Infrastructure.csproj --startup-project src/HeroPassport.Infrastructure/HeroPassport.Infrastructure.csproj --context HeroPassportDbContext --output-dir Persistence/GeneratedMigrations --no-build
      - name: Print generated migration metadata
        run: find src/HeroPassport.Infrastructure/Persistence/GeneratedMigrations -type f -name '*.cs' -print -exec cat {} \;
      - name: Architecture tests
        run: dotnet test tests/HeroPassport.Architecture.Tests/HeroPassport.Architecture.Tests.csproj --no-build -c Release --logger "console;verbosity=normal"
