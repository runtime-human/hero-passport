name: ci

on:
  push:
    branches:
      - main
      - agent/sqlite-foundation
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.302
      - name: SDK
        run: dotnet --info
      - name: Restore
        run: dotnet restore HeroPassport.slnx
      - name: Build
        run: dotnet build HeroPassport.slnx --no-restore -c Release
      - name: Architecture tests
        run: dotnet test tests/HeroPassport.Architecture.Tests/HeroPassport.Architecture.Tests.csproj --no-build -c Release --logger "console;verbosity=normal"

  ef-codegen:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/sqlite-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Skip when migration is already committed
        id: migration
        run: |
          if [ -d src/HeroPassport.Infrastructure/Persistence/GeneratedMigrations ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        if: steps.migration.outputs.needed == 'true'
        with:
          dotnet-version: 10.0.302
      - name: Correct singleton key generation
        if: steps.migration.outputs.needed == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/HeroPassport.Infrastructure/Persistence/StorageModelV1.cs')
          text = path.read_text()
          old = 'entity.Property<int>("id").HasColumnType("INTEGER");'
          assert text.count(old) == 1
          path.write_text(text.replace(old, 'entity.Property<int>("id").HasColumnType("INTEGER").ValueGeneratedNever();'))
          PY
      - name: Restore
        if: steps.migration.outputs.needed == 'true'
        run: dotnet restore HeroPassport.slnx
      - name: Build
        if: steps.migration.outputs.needed == 'true'
        run: dotnet build HeroPassport.slnx --no-restore -c Release
      - name: Restore local tools
        if: steps.migration.outputs.needed == 'true'
        run: dotnet tool restore
      - name: Generate migration
        if: steps.migration.outputs.needed == 'true'
        run: dotnet ef migrations add InitialFoundation --project src/HeroPassport.Infrastructure/HeroPassport.Infrastructure.csproj --startup-project src/HeroPassport.Infrastructure/HeroPassport.Infrastructure.csproj --context HeroPassportDbContext --output-dir Persistence/GeneratedMigrations --configuration Release --no-build
      - name: Commit generated migration
        if: steps.migration.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/HeroPassport.Infrastructure/Persistence/StorageModelV1.cs src/HeroPassport.Infrastructure/Persistence/GeneratedMigrations
          git commit -m "storage: add generated EF migration"
          git push origin HEAD:agent/sqlite-foundation
