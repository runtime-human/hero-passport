name: task10-materialize

on:
  push:
    branches:
      - feat/reward-skill-allocation-red

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/reward-skill-allocation-red
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.302
      - name: Apply Task 10 integration patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected patch anchor not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          finish = "src/HeroPassport.Infrastructure/Persistence/SqliteHeroPassportStateStore.FinishQuest.cs"
          replace_once(
              finish,
              '''        var hero = await HeroProgressRowAsync(connection, transaction, quest.HeroId, cancellationToken).ConfigureAwait(false);\n        var baseXp = MinimalQuestFinishRules.BaseXp(quest.QuestType);\n        var outcomePermille = MinimalQuestFinishRules.OutcomePermille(command.Result);\n        var xpGained = MinimalQuestFinishRules.QuestXp(baseXp, outcomePermille);\n        var totalXpAfter = JsonSafeInteger.Require(checked(hero.TotalXp + xpGained));\n        var levelBefore = MinimalQuestFinishRules.HeroLevel(hero.TotalXp);\n        var levelAfter = MinimalQuestFinishRules.HeroLevel(totalXpAfter);\n        var rankBefore = MinimalQuestFinishRules.RankKey(levelBefore);\n        var rankAfter = MinimalQuestFinishRules.RankKey(levelAfter);\n        var rules = HeroPassportVersions.CurrentRules;\n''',
              '''        var hero = await HeroProgressRowAsync(connection, transaction, quest.HeroId, cancellationToken).ConfigureAwait(false);\n        var rules = HeroPassportVersions.CurrentRules;\n        var reward = CalculateReward(command, quest.QuestType, rules.Reward);\n        var allocations = SkillXpAllocator.Allocate(reward.XpGained, command.SkillsUsed, rules.SkillAllocation);\n        var baseXp = reward.BaseXp;\n        var bonusXp = reward.BonusXp;\n        var penaltyXp = reward.PenaltyXp;\n        var rawXp = reward.RawXp;\n        var outcomePermille = reward.OutcomePermille;\n        var xpGained = reward.XpGained;\n        var totalXpAfter = JsonSafeInteger.Require(checked(hero.TotalXp + xpGained));\n        var levelBefore = MinimalQuestFinishRules.HeroLevel(hero.TotalXp);\n        var levelAfter = MinimalQuestFinishRules.HeroLevel(totalXpAfter);\n        var rankBefore = MinimalQuestFinishRules.RankKey(levelBefore);\n        var rankAfter = MinimalQuestFinishRules.RankKey(levelAfter);\n''')
          replace_once(
              finish,
              '''                $baseXp,0,0,$baseXp,$outcomePermille,$xpGained,\n''',
              '''                $baseXp,$bonusXp,$penaltyXp,$rawXp,$outcomePermille,$xpGained,\n''')
          replace_once(
              finish,
              '''            ("$baseXp", baseXp),\n            ("$outcomePermille", outcomePermille),\n''',
              '''            ("$baseXp", baseXp),\n            ("$bonusXp", bonusXp),\n            ("$penaltyXp", penaltyXp),\n            ("$rawXp", rawXp),\n            ("$outcomePermille", outcomePermille),\n''')
          replace_once(
              finish,
              '''            ("$streak", hero.SuccessStreak),\n            ("$time", timestamp)).ConfigureAwait(false);\n\n        await ExecuteAsync(\n            connection,\n            transaction,\n            "INSERT INTO xp_events(id,quest_id,hero_id,project_id,xp_delta,reward_rule_version,created_at_utc) VALUES($id,$quest,$hero,$project,$xp,$version,$time);",\n''',
              '''            ("$streak", hero.SuccessStreak),\n            ("$time", timestamp)).ConfigureAwait(false);\n\n        await InsertRewardComponentsAsync(\n            connection,\n            transaction,\n            reportId,\n            reward.Components,\n            cancellationToken).ConfigureAwait(false);\n\n        await ApplySkillAllocationsAsync(\n            connection,\n            transaction,\n            reportId,\n            quest.HeroId,\n            allocations,\n            timestamp,\n            cancellationToken).ConfigureAwait(false);\n\n        await ExecuteAsync(\n            connection,\n            transaction,\n            "INSERT INTO xp_events(id,quest_id,hero_id,project_id,xp_delta,reward_rule_version,created_at_utc) VALUES($id,$quest,$hero,$project,$xp,$version,$time);",\n''')
          replace_once(
              finish,
              '''            baseXp,\n            bonusXp: 0,\n            penaltyXp: 0,\n            rawXp: baseXp,\n            outcomePermille,\n''',
              '''            baseXp,\n            bonusXp,\n            penaltyXp,\n            rawXp,\n            outcomePermille,\n''')

          behavior = Path("tests/HeroPassport.Application.Tests/FinishQuestBehaviorTests.cs")
          text = behavior.read_text()
          text = text.replace("Assert.Equal(0, first.Reward.BonusXp);", "Assert.Equal(35, first.Reward.BonusXp);")
          text = text.replace("Assert.Equal(60, first.Reward.RawXp);", "Assert.Equal(95, first.Reward.RawXp);")
          text = text.replace("Assert.Equal(60, first.Reward.XpGained);", "Assert.Equal(95, first.Reward.XpGained);")
          text = text.replace("Assert.Equal(60, first.HeroProgress.TotalXpAfter);", "Assert.Equal(95, first.HeroProgress.TotalXpAfter);")
          text = text.replace("Assert.Equal(60, await ScalarLongAsync", "Assert.Equal(95, await ScalarLongAsync")
          behavior.write_text(text)
          PY
      - name: Restore tools and build model
        run: |
          dotnet tool restore
          dotnet restore HeroPassport.slnx
          dotnet build HeroPassport.slnx --no-restore -c Release
      - name: Generate EF migration
        run: |
          dotnet ef migrations add AddRewardSkillAllocation \
            --project src/HeroPassport.Infrastructure/HeroPassport.Infrastructure.csproj \
            --output-dir Persistence/GeneratedMigrations \
            --configuration Release \
            --no-build
      - name: Commit materialized Task 10 implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if git diff --cached --quiet; then
            echo "No Task 10 changes to commit"
            exit 1
          fi
          git commit -m "feat(game): integrate reward and skill allocation"
          git push origin HEAD:feat/reward-skill-allocation-red
