name: publish-0.1.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-0.1.0.yml'

permissions:
  contents: write
  actions: read
  attestations: read

concurrency:
  group: publish-hero-passport-v0.1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAG: v0.1.0
      VERSION: 0.1.0
      TARGET_SHA: 31409f10465478aba18fbd1f48f1e12a87fd61d0
      QUALIFICATION_RUN: '34440441304'
      ARTIFACT_NAME: hero-passport-0.1.0-31409f10465478aba18fbd1f48f1e12a87fd61d0
      RELEASE_ZIP_SHA256: 4bde06fa4e1df957b8ea88944e2f3493fd892c9bd28278e44417f95077596b80
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Refuse duplicate publication
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing duplicate publication." >&2
            exit 1
          fi

      - name: Download already-qualified release artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download "$QUALIFICATION_RUN" \
            -R "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir release
          test -f "release/hero-passport-$VERSION.zip"
          test -f "release/hero-passport-$VERSION.manifest.json"
          test -f "release/SHA256SUMS"

      - name: Verify exact qualified bytes and manifest
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$RELEASE_ZIP_SHA256" "release/hero-passport-$VERSION.zip" | sha256sum -c -
          python3 - <<'PY'
          import json, os, pathlib
          version = os.environ['VERSION']
          target_sha = os.environ['TARGET_SHA']
          expected_sha256 = os.environ['RELEASE_ZIP_SHA256']
          manifest = json.loads(pathlib.Path(f'release/hero-passport-{version}.manifest.json').read_text(encoding='utf-8'))
          expected = {
              'format': 'hero-passport-release/1',
              'product': 'Hero Passport',
              'version': version,
              'sourceSha': target_sha,
              'archive': f'hero-passport-{version}.zip',
              'sha256': expected_sha256,
          }
          for key, value in expected.items():
              actual = manifest.get(key)
              if actual != value:
                  raise SystemExit(f'manifest mismatch for {key}: expected {value!r}, got {actual!r}')
          print('release manifest matches frozen qualified artifact')
          PY
          grep -Fx "$RELEASE_ZIP_SHA256  hero-passport-$VERSION.zip" release/SHA256SUMS

      - name: Verify existing build provenance
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify "release/hero-passport-$VERSION.zip" -R "$GITHUB_REPOSITORY"

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Hero Passport 0.1.0 is the first qualified release of the local-first RPG passport for AI coding agents.

          ### Release identity
          - Source commit: \`$TARGET_SHA\`
          - Qualified workflow run: \`$QUALIFICATION_RUN\`
          - Release archive SHA-256: \`$RELEASE_ZIP_SHA256\`
          - Artifact: \`hero-passport-$VERSION.zip\`

          ### Qualification
          The same exact release archive passed packaged end-to-end qualification on Ubuntu 24.04, Windows Server 2025, and macOS 15. Codex 0.153.4 is the executable-qualified reference host, including MCP registration, Skill discovery, bootstrap/start/finish lifecycle, restart recovery, card/context reads, and idempotent replay.

          The archive has GitHub/Sigstore build-provenance attestation generated after the three-platform qualification gate.

          ### Runtime
          Hero Passport 0.1.0 is a framework-dependent portable .NET 10 distribution. A compatible .NET 10 runtime is required.

          Canonical entry point:
          \`\`\`text
          dotnet HeroPassport.App.dll --version
          \`\`\`

          ### Verification
          \`\`\`text
          sha256sum -c SHA256SUMS
          gh attestation verify hero-passport-$VERSION.zip -R runtime-human/hero-passport
          \`\`\`

          See \`DISTRIBUTION.md\` and \`docs/release/0.1.0-qualification.md\` for the release contract and qualification ledger.
          EOF

      - name: Create verified draft release with exact assets
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "release/hero-passport-$VERSION.zip" \
            "release/hero-passport-$VERSION.manifest.json" \
            "release/SHA256SUMS" \
            -R "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Hero Passport $VERSION" \
            --notes-file release-notes.md \
            --draft

      - name: Re-download draft asset and verify before publication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-verify
          gh release download "$TAG" \
            -R "$GITHUB_REPOSITORY" \
            --pattern "hero-passport-$VERSION.zip" \
            --dir release-verify
          printf '%s  %s\n' "$RELEASE_ZIP_SHA256" "release-verify/hero-passport-$VERSION.zip" | sha256sum -c -
          gh attestation verify "release-verify/hero-passport-$VERSION.zip" -R "$GITHUB_REPOSITORY"

      - name: Publish v0.1.0 as latest stable release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" \
            -R "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease=false \
            --latest
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,url
