name: task22-authority-migrate

on:
  workflow_dispatch:
  push:
    branches:
      - feat/hero-progression-rank-rules

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/hero-progression-rank-rules
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.302
      - name: Migrate authority consumers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8-sig')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement, found {count}: {old!r}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          finish = 'src/HeroPassport.Infrastructure/Persistence/SqliteHeroPassportStateStore.FinishQuest.cs'
          replace_once(
              finish,
              '''        var totalXpAfter = JsonSafeInteger.Require(checked(hero.TotalXp + xpGained));
          var levelBefore = MinimalQuestFinishRules.HeroLevel(hero.TotalXp);
          var levelAfter = MinimalQuestFinishRules.HeroLevel(totalXpAfter);
          var rankBefore = MinimalQuestFinishRules.RankKey(levelBefore);
          var rankAfter = MinimalQuestFinishRules.RankKey(levelAfter);''',
              '''        var heroProgression = HeroProgressionRules.Apply(hero.TotalXp, xpGained, rules.HeroProgression);
          var totalXpAfter = heroProgression.TotalXpAfter;
          var levelBefore = heroProgression.LevelBefore;
          var levelAfter = heroProgression.LevelAfter;
          var rankBefore = RankRules.Key(levelBefore, rules.Rank);
          var rankAfter = RankRules.Key(levelAfter, rules.Rank);''')
          replace_once(
              finish,
              '        var isLevelCapped = MinimalQuestFinishRules.IsHeroLevelCapped(levelAfter, heroProgressionVersion);',
              '        var isLevelCapped = HeroProgressionRules.IsLevelCapped(levelAfter, heroProgressionVersion);')
          replace_once(
              finish,
              '        var levelXp = MinimalQuestFinishRules.HeroLevelXp(totalXpAfter, levelAfter, heroProgressionVersion);',
              '        var levelXp = HeroProgressionRules.LevelXp(totalXpAfter, levelAfter, heroProgressionVersion);')
          replace_once(
              finish,
              '        var nextLevelXpRequired = MinimalQuestFinishRules.NextHeroLevelXpRequired(levelAfter, heroProgressionVersion);',
              '        var nextLevelXpRequired = HeroProgressionRules.NextLevelXpRequired(levelAfter, heroProgressionVersion);')

          admin = 'src/HeroPassport.Infrastructure/Persistence/SqliteHeroPassportStateStore.HeroAdministration.cs'
          replace_once(
              admin,
              '''        var level = MinimalQuestFinishRules.HeroLevel(hero.TotalXp);
          var isLevelCapped = MinimalQuestFinishRules.IsHeroLevelCapped(level, rules.HeroProgression);
          var levelXp = MinimalQuestFinishRules.HeroLevelXp(hero.TotalXp, level, rules.HeroProgression);
          var nextLevelXpRequired = MinimalQuestFinishRules.NextHeroLevelXpRequired(level, rules.HeroProgression);''',
              '''        var level = HeroProgressionRules.Level(hero.TotalXp, rules.HeroProgression);
          var isLevelCapped = HeroProgressionRules.IsLevelCapped(level, rules.HeroProgression);
          var levelXp = HeroProgressionRules.LevelXp(hero.TotalXp, level, rules.HeroProgression);
          var nextLevelXpRequired = HeroProgressionRules.NextLevelXpRequired(level, rules.HeroProgression);''')
          replace_once(
              admin,
              '                MinimalQuestFinishRules.RankKey(level),',
              '                RankRules.Key(level, rules.Rank),')
          replace_once(
              admin,
              '''        var level = MinimalQuestFinishRules.HeroLevel(hero.TotalXp);
          return new HeroListItemSnapshot(''',
              '''        var rules = HeroPassportVersions.CurrentRules;
          var level = HeroProgressionRules.Level(hero.TotalXp, rules.HeroProgression);
          return new HeroListItemSnapshot(''')
          replace_once(
              admin,
              '            MinimalQuestFinishRules.RankKey(level),',
              '            RankRules.Key(level, rules.Rank),')

          versions = 'src/HeroPassport.Application/Runtime/HeroPassportVersions.cs'
          replace_once(versions, '        "hero-progression/2.0.0",', '        HeroProgressionRules.RuleVersion,')
          replace_once(versions, '        "unlock/2.0.0",', '        UnlockRules.RuleVersion,')
          replace_once(versions, '        "rank/1.0.0");', '        RankRules.RuleVersion);')

          Path('src/HeroPassport.Domain/Engine/MinimalQuestFinishRules.cs').unlink()
          PY
          if rg -n "MinimalQuestFinishRules" src; then
            echo "Legacy MinimalQuestFinishRules reference remains in product source." >&2
            exit 1
          fi
      - name: Verify migrated stack
        shell: bash
        run: |
          dotnet restore HeroPassport.slnx
          dotnet build HeroPassport.slnx -c Release --no-restore
          dotnet test tests/HeroPassport.Domain.Tests/HeroPassport.Domain.Tests.csproj -c Release --no-build
          dotnet test tests/HeroPassport.Application.Tests/HeroPassport.Application.Tests.csproj -c Release --no-build
      - name: Commit migration and remove materializer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/task22-authority-migrate.yml
          git add src tests
          git commit -m "refactor(rpg): route hero progression through versioned authorities"
          git push origin HEAD:feat/hero-progression-rank-rules
