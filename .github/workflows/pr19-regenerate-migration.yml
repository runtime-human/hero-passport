name: pr19-regenerate-migration

on:
  push:
    branches:
      - feat/reward-skill-persistence

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/reward-skill-persistence
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.302
      - name: Restore tools and build
        run: |
          dotnet tool restore
          dotnet restore HeroPassport.slnx
          dotnet build HeroPassport.slnx --no-restore -c Release
      - name: Regenerate latest migration
        run: |
          dotnet ef migrations remove --force \
            --project src/HeroPassport.Infrastructure/HeroPassport.Infrastructure.csproj \
            --configuration Release
          dotnet build HeroPassport.slnx --no-restore -c Release
          dotnet ef migrations add AddRewardSkillPersistence \
            --project src/HeroPassport.Infrastructure/HeroPassport.Infrastructure.csproj \
            --output-dir Persistence/GeneratedMigrations \
            --configuration Release \
            --no-build
      - name: Verify regenerated model
        run: |
          dotnet build HeroPassport.slnx --no-restore -c Release
          dotnet ef migrations has-pending-model-changes \
            --project src/HeroPassport.Infrastructure/HeroPassport.Infrastructure.csproj \
            --configuration Release \
            --no-build
          dotnet test tests/HeroPassport.Application.Tests/HeroPassport.Application.Tests.csproj --no-build -c Release --logger "console;verbosity=normal"
      - name: Commit regenerated migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/HeroPassport.Infrastructure/Persistence/GeneratedMigrations
          git diff --cached --check
          git commit -m "fix(storage): make report skill keys required"
          git push origin HEAD:feat/reward-skill-persistence
