name: release-platform

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".agents/skills/hero-passport/**"
      - ".github/workflows/release-platform.yml"
      - "HeroPassport.slnx"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  platform-qualification:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025
          - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.302
      - name: Restore
        run: dotnet restore HeroPassport.slnx
      - name: Build
        run: dotnet build HeroPassport.slnx --no-restore -c Release
      - name: Platform infrastructure qualification
        run: dotnet test tests/HeroPassport.Infrastructure.Tests/HeroPassport.Infrastructure.Tests.csproj --no-build -c Release --logger "console;verbosity=normal"
      - name: Publish packaged app
        run: dotnet publish src/HeroPassport.App/HeroPassport.App.csproj --no-restore -c Release --no-self-contained -o "${{ github.workspace }}/artifacts/publish/hero-passport"
      - name: Packaged vertical E2E
        env:
          HERO_PASSPORT_PUBLISH_DIR: ${{ github.workspace }}/artifacts/publish/hero-passport
        run: dotnet test tests/HeroPassport.PackagedE2E/HeroPassport.PackagedE2E.csproj --no-build -c Release --logger "console;verbosity=normal"
