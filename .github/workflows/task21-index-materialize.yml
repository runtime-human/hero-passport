name: task21-index-materialize

on:
  push:
    branches:
      - feat/unlock-traits-titles-milestones

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/unlock-traits-titles-milestones
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.302
      - name: Add history index to EF model
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/HeroPassport.Infrastructure/Persistence/HeroPassportStorageModel.cs')
          text = path.read_text(encoding='utf-8')
          old = '''            entity.HasIndex("hero_id", "project_id")
                .IsUnique()
                .HasDatabaseName("ux_quest_sessions_one_open_per_hero_project")
                .HasFilter("status = 'open'");
'''
          new = '''            entity.HasIndex("hero_id")
                .HasDatabaseName("ix_quest_sessions_hero_id");
            entity.HasIndex("hero_id", "project_id")
                .IsUnique()
                .HasDatabaseName("ux_quest_sessions_one_open_per_hero_project")
                .HasFilter("status = 'open'");
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one Quest index block, got {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Restore and build
        run: |
          dotnet tool restore
          dotnet restore HeroPassport.slnx
          dotnet build HeroPassport.slnx --no-restore -c Release
      - name: Generate EF migration
        run: |
          dotnet ef migrations add AddUnlockHistoryIndex \
            --project src/HeroPassport.Infrastructure/HeroPassport.Infrastructure.csproj \
            --configuration Release \
            --no-build
      - name: Verify RED becomes GREEN
        run: |
          dotnet build HeroPassport.slnx --no-restore -c Release
          dotnet test tests/HeroPassport.Application.Tests/HeroPassport.Application.Tests.csproj --no-build -c Release
      - name: Commit materialized index and remove workflow
        run: |
          rm .github/workflows/task21-index-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/HeroPassport.Infrastructure/Persistence/HeroPassportStorageModel.cs \
                  src/HeroPassport.Infrastructure/Persistence/GeneratedMigrations \
                  .github/workflows/task21-index-materialize.yml
          git diff --cached --check
          git commit -m "perf(storage): index quest history by hero"
          git push origin HEAD:feat/unlock-traits-titles-milestones
